; SPDX-License-Identifier: MIT
; lora-raw: raw LoRa tool for the RAK4631 (RAK19007 base) in the WICI pilot profile; README.md.
; The board definition is the nRF52840-DK one of the Adafruit core (same nRF52840, S140 6.1.1, linker
; script and UF2/DFU bootloader layout as the RAK4631), with the variant and upload settings of the RAK4631
; overridden here, so no third-party board package is needed.
[env:rak4631]
platform = nordicnrf52@11.0.0
board = nrf52840_dk_adafruit
framework = arduino
platform_packages =
    platformio/framework-arduinoadafruitnrf52@1.10700.0
board_build.variants_dir = variants
board_build.variant = rak4631_wici
board_build.usb_product = WICI lora-raw
board_upload.protocol = nrfutil
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_unflags = -DARDUINO_NRF52840_PCA10056
build_flags =
    -DARDUINO_RAK4631_WICI
    -DUSE_TINYUSB
    -Wall
lib_deps = jgromes/RadioLib@7.6.0
monitor_speed = 115200
