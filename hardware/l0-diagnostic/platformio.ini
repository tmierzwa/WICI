[env:l0]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = jgromes/RadioLib@7.6.0
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1
; Native USB Serial/JTAG on USB/OTG. UART connector is not used.
; PSRAM is not required by this diagnostic image.
