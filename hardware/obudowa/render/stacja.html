<!doctype html>
<!-- Concept render of the WICI station front. Data comes from uklad.json (zalozenia.py --json),
     injected by render.js as window.UKLAD; nothing here is a production dimension. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<title>WICI – koncepcja stacji</title>
<style>
@font-face { font-family: "Nunito Sans"; src: url("../../../media/logo/fonts/NunitoSans%5BYTLC,opsz,wdth,wght%5D.ttf"); font-weight: 200 1000; }
@font-face { font-family: "DejaVu Mono"; src: url("../../../firmware/fonts/DejaVuSansMono-Bold.ttf"); font-weight: 700; }
html, body { margin: 0; background: #d9d4cb; overflow: hidden; font-family: "Nunito Sans", sans-serif; }
#caption { position: absolute; left: 40px; top: 32px; color: #0f1216; }
#caption b { display: block; font-size: 30px; font-weight: 900; }
#caption span { display: block; font-size: 18px; margin-top: 6px; color: #3d4148; max-width: 1500px; }
#caption.side { top: auto; bottom: 32px; left: 1150px; }
#caption.side span { max-width: 600px; }
#caption.material { top: 40px; left: 56px; }
#caption.material b { font-size: 34px; }
#caption.material span { font-size: 20px; max-width: 1100px; line-height: 1.4; white-space: pre-line; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="caption"><b></b><span></span></div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const U = window.UKLAD;
const VIEW = new URLSearchParams(location.search).get("view") || "front";
const [W, H, D] = U.enclosure.outer;
const [FW, FH] = U.enclosure.foil_recess;
const FRONT = D / 2;                              // front face of the lid, z
const px = u => u - W / 2, py = v => H / 2 - v;  // panel mm (top-left origin) -> scene

await document.fonts.load('900 40px "Nunito Sans"');
await document.fonts.load('700 40px "Nunito Sans"');
await document.fonts.load('700 40px "DejaVu Mono"');

// ---------- renderer, scene, lights ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#d9d4cb");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight("#ffffff", "#8a8172", 0.6));
const key = new THREE.DirectionalLight("#fff6ea", 2.4);
key.position.set(-260, 380, 420);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.6;
Object.assign(key.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 1500 });
scene.add(key);
const fill = new THREE.DirectionalLight("#e8f0ff", 0.7);
fill.position.set(380, -120, 300);
scene.add(fill);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const ABS = mat("#24272b", { roughness: 0.78, envMapIntensity: 0.6 });
const STEEL = mat("#c3c7cc", { metalness: 0.9, roughness: 0.28 });
const STEEL_DARK = mat("#9ea3a9", { metalness: 0.85, roughness: 0.42 });
const BRASS = mat("#c9a23a", { metalness: 0.9, roughness: 0.3 });
const RUBBER = mat("#33363a", { roughness: 0.9 });
const CABLE = mat("#151719", { roughness: 0.55 });

function add(geo, material, x, y, z, rot) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  if (rot) m.rotation.set(...rot);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
}
const cylZ = (r1, r2, h, seg = 64) => new THREE.CylinderGeometry(r1, r2, h, seg);  // rotate x 90° to face front
const FACE = [Math.PI / 2, 0, 0];

// ---------- wall ----------
add(new THREE.PlaneGeometry(3000, 3000), mat("#d6d0c5", { roughness: 1, envMapIntensity: 0.25 }), 0, 0, -D / 2 - 0.05);

// ---------- enclosure: lid and base with a parting groove ----------
const lidDepth = 14;  // parting line position is not known (STEP model); concept only
add(new RoundedBoxGeometry(W, H, lidDepth, 6, 5), ABS, 0, 0, FRONT - lidDepth / 2);
add(new RoundedBoxGeometry(W, H, D - lidDepth - 0.5, 6, 5), ABS, 0, 0, -D / 2 + (D - lidDepth - 0.5) / 2);

// rim around the foil recess
{
  const outer = new THREE.Shape(), r = 3, ow = FW + 2.4, oh = FH + 2.4;
  outer.moveTo(-ow / 2 + r, -oh / 2);
  outer.lineTo(ow / 2 - r, -oh / 2); outer.quadraticCurveTo(ow / 2, -oh / 2, ow / 2, -oh / 2 + r);
  outer.lineTo(ow / 2, oh / 2 - r); outer.quadraticCurveTo(ow / 2, oh / 2, ow / 2 - r, oh / 2);
  outer.lineTo(-ow / 2 + r, oh / 2); outer.quadraticCurveTo(-ow / 2, oh / 2, -ow / 2, oh / 2 - r);
  outer.lineTo(-ow / 2, -oh / 2 + r); outer.quadraticCurveTo(-ow / 2, -oh / 2, -ow / 2 + r, -oh / 2);
  const hole = new THREE.Path();
  hole.moveTo(-FW / 2, -FH / 2); hole.lineTo(FW / 2, -FH / 2); hole.lineTo(FW / 2, FH / 2); hole.lineTo(-FW / 2, FH / 2);
  outer.holes.push(hole);
  add(new THREE.ExtrudeGeometry(outer, { depth: 0.9, bevelEnabled: false }), ABS, 0, 0, FRONT);
}

// ---------- printed panel foil ----------
const S = 10;  // px per mm
const fox = (W - FW) / 2, foy = (H - FH) / 2;
const foil = document.createElement("canvas");
foil.width = Math.round(FW * S); foil.height = Math.round(FH * S);
const g = foil.getContext("2d");
const fx = u => (u - fox) * S, fy = v => (v - foy) * S;
const INK = "#15181c", PAPER = "#ebe8e1", ZONE = "#dcd8cf", RED = "#b3261e";

g.fillStyle = PAPER; g.fillRect(0, 0, foil.width, foil.height);
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(fx(x), fy(y), w * S, h * S, r * S); }
function text(t, u, v, size, weight = 800, color = INK, align = "center") {
  g.font = `${weight} ${size * S}px "Nunito Sans"`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic";
  g.fillText(t, fx(u), fy(v));
}

// side column zone: alarm, CISZA, power switch
rrect(164, 11, 42, 118, 3); g.fillStyle = ZONE; g.fill();

// display window frame
const [ww, wh] = U.display.window, [wcx, wcy] = U.display.window_center;
rrect(wcx - ww / 2 - 3.5, wcy - wh / 2 - 3.5, ww + 7, wh + 7, 2.5); g.fillStyle = INK; g.fill();
text("OK = TAK      WSTECZ = NIE", wcx, wcy + wh / 2 + 10, 3.2, 700, "#3b3f45");

// logo and name
if (window.LOGO) {
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(window.LOGO);
  await img.decode();
  const lh = 11, lw = lh * img.width / img.height;
  g.drawImage(img, fx(97), fy(15), lw * S, lh * S);
}
text("STACJA ŁĄCZNOŚCI AWARYJNEJ", 97, 33, 3.0, 800, INK, "left");
text("СТАНЦІЯ АВАРІЙНОГО ЗВ'ЯЗКУ · EMERGENCY RADIO", 97, 37.6, 2.2, 600, "#4a4f57", "left");

// navigation buttons: printed ring, symbol, trilingual label
function symbol(kind, u, v) {
  const s = 2.6 * S, x = fx(u), y = fy(v);
  g.fillStyle = INK; g.strokeStyle = INK; g.lineWidth = 0.9 * S; g.lineCap = g.lineJoin = "round";
  g.beginPath();
  if (kind === "GÓRA") { g.moveTo(x, y - s); g.lineTo(x + s, y + s * 0.7); g.lineTo(x - s, y + s * 0.7); g.closePath(); g.fill(); }
  if (kind === "DÓŁ") { g.moveTo(x, y + s); g.lineTo(x + s, y - s * 0.7); g.lineTo(x - s, y - s * 0.7); g.closePath(); g.fill(); }
  if (kind === "OK") { g.moveTo(x - s, y); g.lineTo(x - s * 0.25, y + s * 0.8); g.lineTo(x + s * 1.1, y - s * 0.9); g.stroke(); }
  if (kind === "WSTECZ") { g.moveTo(x + s, y); g.lineTo(x - s * 0.9, y); g.stroke();
    g.beginPath(); g.moveTo(x - s * 1.2, y); g.lineTo(x - s * 0.1, y - s * 0.8); g.lineTo(x - s * 0.1, y + s * 0.8); g.closePath(); g.fill(); }
}
for (const b of U.panel) {
  const [u, v] = b.xy;
  if (b.kind === "nav") {
    g.beginPath(); g.arc(fx(u), fy(v), 12 * S, 0, 2 * Math.PI); g.fillStyle = ZONE; g.fill();
    symbol(b.id, u, v - 16.5);
    text(b.id, u, v + 17, 4.6, 900);
    text(`${b.uk} · ${b.en}`, u, v + 21.6, 2.5, 700, "#4a4f57");
  }
  if (b.kind === "led") {
    text("ALARM", u, v + 9.5, 3.6, 900, RED);
  }
  if (b.kind === "guard") {
    text("CISZA RADIOWA", u, v + 25.5, 3.3, 900);
  }
  if (b.kind === "power") {
    text("WYŁĄCZNIK", u, v + 18.5, 3.4, 900);
    text("WYŁĄCZ: TRZYMAJ 2 s", u, v + 22.6, 2.3, 700, "#4a4f57");
  }
  if (b.kind === "seal") {
    text("SERWIS", u, v - b.size[1] / 2 - 1.6, 2.4, 800, "#4a4f57");
  }
}
// connector hints on the bottom edge
for (const c of U.connectors) {
  text(`${c.label} ▾`, c.x, H - foy - 1.6, 2.6, 800, "#4a4f57");
}
const foilTex = new THREE.CanvasTexture(foil);
foilTex.colorSpace = THREE.SRGBColorSpace;
foilTex.anisotropy = 8;
add(new THREE.PlaneGeometry(FW, FH), mat("#ffffff", { map: foilTex, roughness: 0.82, envMapIntensity: 0.5 }), 0, 0, FRONT + 0.2).castShadow = false;

// ---------- display: Sharp memory LCD, 400 x 240, 20 x 40 px cells ----------
{
  const [npx, npy] = U.display.pixels, [aw, ah] = U.display.active;
  const lcd = document.createElement("canvas"); lcd.width = npx; lcd.height = npy;
  const l = lcd.getContext("2d");
  l.fillStyle = "#c5c9c0"; l.fillRect(0, 0, npx, npy);
  l.fillStyle = "#1a1c1b"; l.font = '700 33.2px "DejaVu Mono"'; l.textBaseline = "alphabetic";
  U.screen_rows.forEach((row, i) => l.fillText(row, 0, i * 40 + 31));
  // scale up without smoothing so the pixels stay visible, and add the inactive border of the panel
  const k = 5, big = document.createElement("canvas");
  const bw = Math.round(npx * k * ww / aw), bh = Math.round(npy * k * wh / ah);
  big.width = bw; big.height = bh;
  const b = big.getContext("2d");
  b.fillStyle = "#9da197"; b.fillRect(0, 0, bw, bh);
  b.imageSmoothingEnabled = false;
  b.drawImage(lcd, (bw - npx * k) / 2, (bh - npy * k) / 2, npx * k, npy * k);
  const tex = new THREE.CanvasTexture(big); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  add(new THREE.PlaneGeometry(ww, wh), new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.5, clearcoat: 1, clearcoatRoughness: 0.35 }),
      px(wcx), py(wcy), FRONT + 0.3).castShadow = false;
}

// ---------- panel parts ----------
for (const p of U.panel) {
  const [u, v] = p.xy, x = px(u), y = py(v);
  if (p.kind === "nav" || p.kind === "power") {
    let base = FRONT;
    if (p.kind === "power") {  // collar keeps the power button ~3 mm below its rim
      const ring = new THREE.Shape(); ring.absarc(0, 0, 13, 0, Math.PI * 2);
      const h = new THREE.Path(); h.absarc(0, 0, 10.2, 0, Math.PI * 2, true); ring.holes.push(h);
      add(new THREE.ExtrudeGeometry(ring, { depth: 5.5, bevelEnabled: true, bevelSize: 0.6, bevelThickness: 0.6, curveSegments: 64 }),
          mat("#2e3236", { roughness: 0.7 }), x, y, FRONT);
    }
    add(cylZ(9.6, 9.8, 2.2), STEEL, x, y, base + 1.1, FACE);
    add(cylZ(6.5, 6.5, 2.8), p.kind === "power" ? mat("#2f7d3a", { metalness: 0.5, roughness: 0.35 }) : STEEL_DARK, x, y, base + 1.4, FACE);
  }
  if (p.kind === "led") {
    add(cylZ(4.2, 4.4, 1.6), STEEL, x, y, FRONT + 0.8, FACE);
    const dome = add(new THREE.SphereGeometry(2.7, 48, 24), mat("#ff3b2f", { emissive: "#ff2010", emissiveIntensity: 0.9, roughness: 0.25 }), x, y, FRONT + 1.6);
    dome.scale.set(1, 1, 0.9);
  }
  if (p.kind === "guard") {  // footprint and height of GT-4R are measurements; this is a stand-in
    add(new RoundedBoxGeometry(20, 38, 3, 4, 1.2), mat("#1d1f22"), x, y, FRONT + 1.5);
    add(new RoundedBoxGeometry(16, 33, 15, 5, 3.5),
        new THREE.MeshPhysicalMaterial({ color: "#c62a22", roughness: 0.3, transparent: true, opacity: 0.88, clearcoat: 0.6 }),
        x, y - 1, FRONT + 3 + 7.5);
    add(new THREE.CylinderGeometry(1.6, 1.6, 18, 32), STEEL, x, y + 16.5, FRONT + 4, [0, 0, Math.PI / 2]);
  }
  if (p.kind === "seal") {  // numbered VOID sticker over the preparation button hole
    const [sw, sh] = p.size, k = 40;
    const c = document.createElement("canvas"); c.width = sw * k; c.height = sh * k;
    const t = c.getContext("2d");
    t.fillStyle = "#c9ccd0"; t.fillRect(0, 0, c.width, c.height);
    t.fillStyle = "rgba(255,255,255,0.35)"; t.font = `900 ${3.2 * k}px "Nunito Sans"`; t.textAlign = "center";
    for (let i = -1; i < 4; i++) for (let j = 0; j < 3; j++) t.fillText("VOID", (i * 9 + (j % 2) * 4.5) * k, (j * 4.5 + 3.4) * k);
    t.fillStyle = "#15181c"; t.font = `900 ${2.6 * k}px "Nunito Sans"`;
    t.fillText("PLOMBA WICI", c.width / 2, 4.4 * k);
    t.font = `700 ${3.0 * k}px "DejaVu Mono"`; t.fillText("Nr 000123", c.width / 2, 8.6 * k);
    t.font = `600 ${1.5 * k}px "Nunito Sans"`; t.fillText("NIE ZRYWAĆ", c.width / 2, 11 * k);
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    add(new THREE.PlaneGeometry(sw, sh), mat("#ffffff", { map: tex, metalness: 0.55, roughness: 0.35 }), x, y, FRONT + 0.32).castShadow = false;
  }
}

// ---------- bottom wall connectors and cables ----------
const BOTTOM = -H / 2, CZ = -6;  // connector axis depth is a measurement; concept value
function cable(points, r, material) {
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p))), 120, r, 20), material, 0, 0, 0);
}
for (const c of U.connectors) {
  const x = px(c.x);
  if (c.id === "USB-C") {   // laptop podłączony: wtyk z przewodem, zatyczka zwisa na uwięzi
    const PLUG = mat("#d4d7db", { roughness: 0.45 });
    add(new RoundedBoxGeometry(11.5, 1.2, 5.5, 3, 1.2), STEEL, x, BOTTOM - 0.5, CZ);
    add(new RoundedBoxGeometry(12.5, 20, 7, 4, 2.6), PLUG, x, BOTTOM - 11, CZ);
    add(new THREE.CylinderGeometry(2.4, 3.0, 9, 32), PLUG, x, BOTTOM - 25, CZ);
    cable([[x, BOTTOM - 29, CZ], [x, BOTTOM - 55, CZ - 1], [x - 12, BOTTOM - 140, CZ - 8], [x - 30, BOTTOM - 400, -D / 2 + 3]], 2.0, PLUG);
    add(new RoundedBoxGeometry(3.5, 12, 1.0, 2, 0.4), RUBBER, x + 9.5, BOTTOM - 6, CZ + 3);
    add(new RoundedBoxGeometry(12, 6.5, 5, 4, 1.8), RUBBER, x + 10, BOTTOM - 15, CZ + 3.5, [0.15, 0, 0.25]);
  }
  if (c.id === "12 V") {
    add(new THREE.CylinderGeometry(10, 10, 3, 6), STEEL, x, BOTTOM - 1.5, CZ);
    add(new THREE.CylinderGeometry(8.2, 8.2, 7, 48), mat("#1b1d20"), x, BOTTOM - 6.5, CZ);
    add(new THREE.CylinderGeometry(8.8, 7.6, 24, 48), mat("#1b1d20", { roughness: 0.5 }), x, BOTTOM - 22, CZ);
    cable([[x, BOTTOM - 33, CZ], [x, BOTTOM - 70, CZ - 2], [x + 6, BOTTOM - 140, CZ - 9], [x + 10, BOTTOM - 400, -D / 2 + 3.5]], 3.1, CABLE);
  }
  if (c.id === "ANTENA") {
    add(new THREE.CylinderGeometry(4.6, 4.6, 2.6, 6), BRASS, x, BOTTOM - 1.3, CZ);
    add(new THREE.CylinderGeometry(3.2, 3.2, 6, 32), BRASS, x, BOTTOM - 5.5, CZ);
    add(new THREE.CylinderGeometry(4.3, 4.3, 7.5, 6), STEEL, x, BOTTOM - 11.5, CZ);
    add(new THREE.CylinderGeometry(3.6, 3.2, 12, 32), CABLE, x, BOTTOM - 21, CZ);
    cable([[x, BOTTOM - 26, CZ], [x, BOTTOM - 60, CZ - 1], [x - 8, BOTTOM - 150, CZ - 8], [x - 14, BOTTOM - 400, -D / 2 + 3.5]], 3.05, CABLE);
  }
}

// ---------- camera ----------
const camera = new THREE.PerspectiveCamera(VIEW === "zlacza" ? 34 : VIEW === "materialy" ? 20 : 30, innerWidth / innerHeight, 1, 5000);
if (VIEW === "front") { camera.position.set(95, 75, 560); camera.lookAt(10, -28, 0); }
// Materiały: ciasny kadr 3/4 z krótkim podpisem, że to wizualizacja koncepcyjna.
else if (VIEW === "materialy") { camera.position.set(200, 105, 600); camera.lookAt(-6, -8, 0); document.getElementById("caption").className = "material"; }
else { camera.position.set(-200, -310, 270); camera.lookAt(20, -10, -5); document.getElementById("caption").className = "side"; }
renderer.render(scene, camera);

if (VIEW === "materialy") {
  document.querySelector("#caption b").textContent = "Stacja WICI – wizualizacja koncepcyjna";
  document.querySelector("#caption span").textContent =
    "Wygląd, obudowa i rozmieszczenie elementów zmienią się po próbach i pilotażu.\n" +
    "Założenia: ekran 2,7\", przyciski do obsługi w rękawicach, zasilanie z ogniw AA albo 12 V, antena zewnętrzna 868 MHz.";
} else {
  document.querySelector("#caption b").textContent =
    VIEW === "front" ? "WICI – koncepcja stacji (założenia na 2026-10-11)" : "WICI – złącza na dolnej ściance (koncepcja)";
  document.querySelector("#caption span").textContent =
    `${U.enclosure.model} ${W} × ${H} × ${D} mm · układ panelu: ${U.source}. ` +
    `Bez pomiarów (${U.unmeasured.length}): wnętrze, słupki, śruby pokrywy, linia podziału, wysokości złączy i kształt osłony CISZY są umowne. Przycisk przygotowania pod naklejką VOID (F113).`;
}
window.RENDER_DONE = true;
</script>
</body>
</html>
