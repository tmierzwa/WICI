version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["**/*.py", "media/infografika/render.js", "hardware/obudowa/render/render.js", "hardware/obudowa/render/stacja.html", "software/reference/schema.sql", ".github/**", "firmware/**", "**/*.c", "**/*.h", "**/*.cpp", "**/*.hpp", "**/*.ino", "**/*.sh", "**/platformio.ini", "**/CMakeLists.txt"]
