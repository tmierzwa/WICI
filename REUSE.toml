[[annotations]]
path = "firmware/patches/microStore/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "Apache-2.0"

# Verbatim license texts carry the terms they state.
[[annotations]]
path = "hardware/*/fabrication/*/LICENSES/CC-BY-4.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Creative Commons Corporation"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "hardware/*/fabrication/*/LICENSES/CERN-OHL-P-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "CERN"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
