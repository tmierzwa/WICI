# SPDX-License-Identifier: CC-BY-4.0
# Machine-readable form of LICENSE.md. Later annotations override earlier ones.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["**/*.py", "software/reference/schema.sql", ".github/**", "firmware/**", "**/*.c", "**/*.h", "**/*.cpp", "**/*.hpp", "**/*.ino", "**/*.sh", "**/platformio.ini", "**/CMakeLists.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["docs/spec/**", "docs/concept/05-projekt-koncepcyjny-komunikacji.html"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

# Board projects under hardware/<board>/: own design files are CERN-OHL-P-2.0,
# KiCad library subsets keep their own license, own footprints live in WICI.pretty.
[[annotations]]
path = [
  "hardware/*/cad/*.kicad_*",
  "hardware/*/cad/*-lib-table",
  "hardware/*/bom.csv",
  "hardware/*/connections.*",
  "hardware/*/polaczenia.md",
  "hardware/*/uruchomienie.md",
  "hardware/*/przed-produkcja.md",
  "hardware/*/*.pdf",
  "hardware/*/fabrication/**",
  "hardware/*/checks/**/*.kicad_pcb",
  "hardware/*/checks/**/*.dsn",
  "hardware/*/checks/**/*.ses",
  "hardware/*/checks/*.xml",
  "hardware/*/checks/preview/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
path = [
  "hardware/*/fabrication/*/README.md",
  "hardware/*/fabrication/*/NOTICE.md",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "hardware/*/cad/symbols/**",
  "hardware/*/cad/footprints/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "KiCad Libraries Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"

[[annotations]]
path = "hardware/*/cad/footprints/WICI.pretty/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Tomek Mierzwa and WICI contributors"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
path = "media/logo/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Nunito Sans Project Authors (https://github.com/Fonthausen/NunitoSans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "firmware/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2003 Bitstream, Inc. (Bitstream Vera); DejaVu changes are in public domain"
SPDX-License-Identifier = "Bitstream-Vera"

# Bitmap glyphs generated from DejaVu Sans Mono Bold: the header is MIT, the letter shapes keep the font license.
[[annotations]]
path = "firmware/src/font_glyphs.h"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Tomek Mierzwa and WICI contributors", "2003 Bitstream, Inc. (Bitstream Vera); DejaVu changes are in public domain"]
SPDX-License-Identifier = "MIT AND Bitstream-Vera"

# Verbatim license texts carry the terms they state.
[[annotations]]
path = "hardware/*/fabrication/*/LICENSES/CC-BY-4.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "Creative Commons Corporation"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "hardware/*/fabrication/*/LICENSES/CERN-OHL-P-2.0.txt"
precedence = "override"
SPDX-FileCopyrightText = "CERN"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
path = "hardware/*/cad/KICAD-LIBRARY-LICENSE.md"
precedence = "override"
SPDX-FileCopyrightText = "KiCad Libraries Team and contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"
