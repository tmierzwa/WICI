name: Raport z próby / Test report
description: Wynik próby fizycznej, na płytkach rozwojowych albo na emulatorze, według docs/spec/odbior.md
labels: [próba]
body:
  - type: input
    id: test
    attributes:
      label: Próba
      description: Nazwa z tabeli odbioru lub grupa T1–T8 oraz wymagania W, których dotyczy
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Wersja źródeł
      description: Commit WICI (w tym docs/spec/odbior.md), przypięte commity microReticulum, LXMF i Reticulum, numer egzemplarza i osoba wykonująca
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Konfiguracja
      description: Rewizja sprzętu i źródeł, BOM wariantu, rodzina MCU, wersje bibliotek, oprogramowania stacji i systemu, rodzaj i napięcie ogniw, host i router, topologia, anteny (typ, zysk, wysokość) i przewody
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Warunki i metoda
      description: Miejsce, temperatura, źródła i obciążenia, przyrządy, liczba powtórzeń; metoda synchronizacji zegarów i odchyłka na końcu próby
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Wynik i surowe dane
      description: Wynik względem warunku zaliczenia; załącz surowe dane. Dla komunikacji podaj id/revision, czas lokalnego zapisu, COMMIT u odbiorcy i powrotu RECEIVED, liczbę datagramów, czas TX, odrzuty i restarty. Nie publikuj kluczy, tokenów ani danych mieszkańców.
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Rzetelność
      options:
        - label: Liczbę powtórzeń i warunek zaliczenia ustalono przed wykonaniem próby
          required: true
        - label: Raport nie zawiera kluczy, tokenów ani danych mieszkańców
          required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Ocena
      options: [zaliczona, niezaliczona, niepełna]
    validations:
      required: true
