# SPDX-License-Identifier: MIT
name: Checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # = "python" w software/laptop/build/runtimes.json; Unicode 16 jak firmware/src/unicode_tables.h.
          python-version: '3.14.8'
      - name: Envelope reference dependency
        run: python -m pip install cryptography==48.0.1
      # Sama przypięta biblioteka Crypto: próby koperty, WICI-Link, przeniesienia i rdzenia. Próby wrogiego ruchu
      # z całym stosem idą w firmware.yml (hostile, hostile-port), więc tu pomijają się z braku źródeł stosu.
      - name: Pinned Crypto sources
        run: >-
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'firmware/tools'); import stack_deps;
          stack_deps.DEPS[:] = [d for d in stack_deps.DEPS if d[0] == 'Crypto']; stack_deps.fetch(Path('firmware'))"
      # Ten przebieg ma kompilator, kryptografię, Crypto i Unicode 16: próba pominięta z ich braku to błąd CI.
      # Pozostałe pominięcia (Reticulum w Pythonie, PlatformIO, 32-bit, cały stos, Pillow) mają własne zadania.
      - name: Reference contracts and publication regressions
        shell: bash
        run: |
          python -m unittest discover -s software/reference -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          python -m unittest discover -s tests -v 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          ! grep -E "skipped '(.*C\+\+ compiler|cryptography|.*differs from Unicode)" "$RUNNER_TEMP/tests.log"
      # Manifest hashes are refreshed after merging (CONTRIBUTING.md), so only a v* tag checks them.
      - name: Read-only source and controller checks
        run: python tools/verify_repository.py ${{ !startsWith(github.ref, 'refs/tags/') && '--pull-request' || '' }}
      - name: Source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/release.py --source-zip dist/WICI-0.5-source.zip
      - name: License annotations (REUSE)
        run: pipx run reuse==5.0.2 lint
  dco:
    # CONTRIBUTING.md, "Pochodzenie wkładu (DCO)": każdy commit PR ma Signed-off-by.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Signed-off-by in every commit
        run: python tools/check_dco.py ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
