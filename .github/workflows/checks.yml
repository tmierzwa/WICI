# SPDX-License-Identifier: MIT
name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reference contracts
        run: python -m unittest discover -s software/reference -v
      - name: Publication regressions
        run: python -m unittest discover -s tests -v
      - name: Read-only source and controller checks
        run: python tools/verify_repository.py ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
      - name: Source archive
        if: github.event_name != 'pull_request'
        run: python tools/release.py --source-zip dist/WICI-0.4-source.zip
      - name: License annotations (REUSE)
        run: pipx run reuse==5.0.2 lint
