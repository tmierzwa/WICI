# SPDX-License-Identifier: MIT
# Aplikacja laptopa (software/laptop): testy na każdym systemie i pamięć USB zbudowana z przypiętych
# środowisk Pythona, uruchomiona przez START na Windows, macOS (Apple Silicon i Intel) i Linuksie.
name: Laptop
on:
  pull_request:
    # Druga strona kontraktu też: firmware, symulator i protokół USB.
    paths: ['software/laptop/**', 'tests/test_laptop.py', 'tests/test_laptop_audit.py', 'tests/test_laptop_http_memory.py', 'tests/laptop-form.test.cjs', '.github/workflows/laptop.yml', 'firmware/src/**',
            'software/simulator/web/**', 'software/simulator/swiat.mjs', 'software/simulator/swiat.html', 'docs/spec/protokol-usb.md', 'tests/test_stanowisko.py', 'firmware/lib/**', 'firmware/platformio.ini',
            'firmware/tools/rns_osp_node.py', 'firmware/tools/sa1_lxmf.py', 'firmware/tools/udp_ports.py',
            'software/reference/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, panel, build and simulator tests
        run: python -m unittest discover -s tests -p "test_laptop*.py" -v
      - name: Form audit regressions
        run: node --test tests/laptop-form.test.cjs

  stanowisko:
    # Aplikacja stanowiska odbiorczego (wici/stanowisko) za węzłem stanowiska: dwa programy "host" firmware
    # (stacja i węzeł na emulowanym łączu radiowym, port danych węzła jako pseudoterminal). Reticulum i LXMF
    # w przypiętych wersjach bez pakietu cryptography, czyli z kryptografią wbudowaną w Reticulum, jak
    # w pakiecie stanowiska; Python 3.14 jak środowisko pakietu. Ten sam krok uruchamia aplikację w świecie
    # symulatora (swiat.mjs --stanowisko, port danych węzła na TCP), z Node.js obrazu runnera.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/stack
          key: pio-host-${{ hashFiles('firmware/platformio.ini', 'firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: software/laptop/build/cache
          key: stanowisko-${{ hashFiles('software/laptop/build/runtimes.json', 'software/laptop/build/stanowisko.json') }}
      - name: PlatformIO Core, Reticulum, LXMF and pyserial at the pinned versions
        run: |
          python3.12 -m pip install platformio==6.2.0
          python3.14 -m venv "$RUNNER_TEMP/rns"
          "$RUNNER_TEMP/rns/bin/pip" install --no-deps "rns @ git+https://github.com/markqvist/Reticulum@e40191b3d193b46b7f2d8a44424a594cd758839b" \
            "lxmf @ git+https://github.com/markqvist/LXMF@c3ff2d6dc2f256daab896dadc044dd5a913ecbb7" pyserial==3.5
          "$RUNNER_TEMP/rns/bin/python" -c "from RNS.Cryptography import Provider; assert Provider.backend() == 'internal'"
      - name: Station and node host program
        run: pio run -e host -d firmware
      - name: Application stack behind the OSP node
        run: WICI_HOST_PROGRAM=firmware/.pio/build/host/program "$RUNNER_TEMP/rns/bin/python" -m unittest tests.test_stanowisko -v
      - name: Station package (pinned runtime and libraries, checked SHA-256)
        run: python3.14 software/laptop/build/build_stanowisko.py --out "$RUNNER_TEMP/pakiet" --only linux-x86_64
      - name: Application from the package in the simulator world
        run: WICI_STANOWISKO_PACKAGE="$RUNNER_TEMP/pakiet" python3.14 -m unittest tests.test_stanowisko.SimulatorTest -v

  usb:
    # Ścieżka ze spacją i polską literą: pamięć bywa zamontowana pod dowolną nazwą.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, runtime: linux-x86_64}
          - {os: windows-2025, runtime: windows-amd64}
          - {os: macos-15, runtime: macos-arm64}
          - {os: macos-15-intel, runtime: macos-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'   # = "python" w software/laptop/build/runtimes.json (sprawdza test)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: software/laptop/build/cache
          key: usb-${{ matrix.runtime }}-${{ hashFiles('software/laptop/build/runtimes.json') }}
      - name: MinGW-w64 for START-WINDOWS.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
      - name: Build the USB tree (pinned runtimes, checked SHA-256)
        run: python software/laptop/build/build_usb.py --out "usb ż" --only ${{ matrix.runtime }}
      - name: Selftest through START (Linux)
        if: runner.os == 'Linux'
        run: |
          # START kopiuje środowisko i aplikację do ~/.cache/wici i uruchamia je stamtąd; pamięć podaje w WICI_USB.
          sh "usb ż/START-LINUX.sh" --selftest | tee selftest.txt
          grep -q "stdlib .*/.cache/wici/.*/runtime/python314.zip" selftest.txt
          grep -q "usb .*/usb ż" selftest.txt
          grep -q "z_pamieci 0" selftest.txt
          chmod -x "usb ż/runtime/linux-x86_64/bin/python3.14"   # pamięć bez prawa wykonywania: ta sama kopia
          sh "usb ż/START-LINUX.sh" --selftest | tee selftest-copy.txt
          grep -q "stdlib .*/.cache/wici/.*/runtime/python314.zip" selftest-copy.txt
          # Wyjęcie pamięci: aplikacja działa dalej z kopii.
          sh "usb ż/START-LINUX.sh" --no-browser --http 0 > run.txt 2>&1 &
          for _ in $(seq 30); do grep -q "http://127.0.0.1" run.txt && break; sleep 1; done
          mv "usb ż" usb-wyjeta
          sleep 1
          curl -sf "$(grep -o 'http://127.0.0.1:[0-9]*' run.txt | head -1)/health"
          pkill -f "wici/.*/app/wici.pyz" || true
          mv usb-wyjeta "usb ż"
      - name: Selftest through START (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          "usb ż/START-MAC.app/Contents/MacOS/START" --selftest | tee selftest.txt
          grep -q "stdlib .*/Library/Caches/WICI/.*/runtime/python314.zip" selftest.txt
          grep -q "usb .*/usb ż" selftest.txt
          grep -q "z_pamieci 0" selftest.txt
          # Jak po dwukrotnym kliknięciu: przez LaunchServices, dwa razy.
          for i in 1 2; do
            open -W --stdout "$PWD/open-$i.txt" --stderr "$PWD/open-$i.txt" "usb ż/START-MAC.app" --args --selftest
            cat "open-$i.txt"
            grep -q "selftest ok" "open-$i.txt"
          done
          # START kończy się, gdy aplikacja działa w tle, więc drugi START nie trafia do „już otwartego” programu
          # i podaje adres panelu działającej aplikacji.
          open --stdout "$PWD/run-1.txt" --stderr "$PWD/run-1.txt" "usb ż/START-MAC.app" --args --no-browser --http 0
          sleep 5
          open -W --stdout "$PWD/run-2.txt" --stderr "$PWD/run-2.txt" "usb ż/START-MAC.app" --args --no-browser
          for _ in $(seq 30); do grep -q "http://127.0.0.1" run-2.txt && break; sleep 1; done
          cat run-1.txt run-2.txt
          pkill -f "app/wici.pyz" || true
          grep -q "http://127.0.0.1" run-2.txt
          # Pamięć FAT32 wysunięta przy działającej aplikacji: wysunięcie się udaje, a aplikacja działa dalej.
          hdiutil create -quiet -size 80m -fs MS-DOS -volname WICIUSB fat.dmg
          mnt=$(hdiutil attach fat.dmg | awk -F'\t' '/WICIUSB/{print $NF}')
          cp -R "usb ż/" "$mnt/"
          "$mnt/START-MAC.app/Contents/MacOS/START" --no-browser --http 0 > run-fat.txt 2>&1
          for _ in $(seq 30); do grep -q "http://127.0.0.1" run-fat.txt && break; sleep 1; done
          hdiutil detach "$mnt"
          sleep 2
          curl -sf "$(grep -o 'http://127.0.0.1:[0-9]*' run-fat.txt | head -1)/health"
          pkill -f "app/wici.pyz" || true
      - name: Selftest through START (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "usb ż\START-WINDOWS.exe" -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "START-WINDOWS.exe --selftest: $($p.ExitCode)" }
          $copy = Get-ChildItem "$env:LOCALAPPDATA\WICI\srodowisko" -Directory
          $copy
          if (@($copy).Count -ne 1 -or -not (Test-Path "$($copy.FullName)\app\wici.pyz")) { throw 'no copy of the runtime on the disk' }
          $out = & "$($copy.FullName)\runtime\windows\python.exe" "$($copy.FullName)\app\wici.pyz" --selftest
          $out
          if (-not ($out -match 'srodowisko\\.*\\runtime\\python314\.zip')) { throw 'shared standard library not from the copy' }
          # Wyjęcie pamięci: START kończy się po 2 s, aplikacja działa z kopii, więc katalog pamięci da się przenieść.
          # -Wait czekałoby na całe drzewo procesów, także na aplikację; WaitForExit czeka tylko na START.
          $p = Start-Process -FilePath "usb ż\START-WINDOWS.exe" -ArgumentList '--no-browser','--http','0' -PassThru
          $null = $p.Handle   # bez zapamiętanego uchwytu ExitCode bywa pusty
          if (-not $p.WaitForExit(30000)) { throw 'START-WINDOWS.exe did not end after the application started' }
          if ($p.ExitCode -ne 0) { throw "START-WINDOWS.exe: $($p.ExitCode)" }
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$env:LOCALAPPDATA\WICI\instance.json"); $i++) { Start-Sleep 1 }
          Rename-Item "usb ż" usb-wyjeta
          $port =(Get-Content "$env:LOCALAPPDATA\WICI\instance.json" | ConvertFrom-Json).port
          Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health" | Select-Object -ExpandProperty StatusCode
          Get-CimInstance Win32_Process -Filter "Name = 'pythonw.exe'" | Where-Object { $_.CommandLine -like '*srodowisko*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId }
          Rename-Item usb-wyjeta "usb ż"

  size:
    # Cała pamięć USB naraz: rozmiar każdej części i budżet z build_usb.py (BUDGET); drzewo jako artefakt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: software/laptop/build/cache
          key: usb-all-${{ hashFiles('software/laptop/build/runtimes.json', 'software/laptop/build/slowa/zrodla.json') }}
      # Pakiety MinGW (115 MB) z pamięci podręcznej: lustro Ubuntu w Azure podaje je czasem z prędkością
      # około 45 kB/s, krok trwał wtedy 30–35 min zamiast kilkunastu sekund. apt pobiera tylko pakiety,
      # których nie ma w katalogu; nowsza wersja w Ubuntu pobiera się przy każdym przebiegu, dopóki nie
      # zmieni się klucz (pamięć podręczna pod istniejącym kluczem się nie nadpisuje).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-mingw
          key: apt-mingw-ubuntu-24.04
      - name: MinGW-w64 cross compiler
        run: |
          mkdir -p ~/apt-mingw
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-mingw" gcc-mingw-w64-x86-64
          sudo rm -rf ~/apt-mingw/partial ~/apt-mingw/lock
          sudo chown -R "$USER" ~/apt-mingw
      - name: Build every runtime and check the size budget
        run: python software/laptop/build/build_usb.py --out usb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wici-usb
          path: usb
          if-no-files-found: error
      - name: Word list matches its pinned sources and exclusions
        run: python software/laptop/build/slowa/build_slowa.py --check
