# SPDX-License-Identifier: MIT
# Kompilacja obrazów stacji (firmware/README.md): bench-a, bench-n1 (nRF52840), bench-b i l0 (ESP32-S3),
# oraz programu węzła na komputerze (host), na którym stoją próby zgodności z Reticulum (tests/test_rns_stack.py).
# Rdzeń Reticulum stacji (lib/reticulum_core) jeszcze nie wchodzi do obrazów, więc dla każdej płytki osobno
# kompiluje się go kompilatorem i flagami obrazu z -Werror, ze sprawdzeniem stosu i RAM (tools/core_boards.py).
# Do tego stos stacji pod wrogim ruchem z sanitizerami (tests/test_rns_hostile.py), rdzeń pod libFuzzerem
# przez 60 s w osobnym zadaniu (tools/core_fuzz.py; godzina w fuzz.yml) i próba zgodności
# z Reticulum w Pythonie na przypiętym commicie.
# Wersje platform i rdzeni są przypięte w firmware/platformio.ini, stos Reticulum w tools/stack_deps.py.
name: Firmware
on:
  push:
    branches: [main]
    paths: ['firmware/**', 'tests/test_rns_*.py', 'tests/test_rnscore.py', 'tests/test_rnscore_lxmf.py', 'tests/native/rns_*', 'tests/native/rnscore_*', 'tests/vectors/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'tests/test_rns_*.py', 'tests/test_rnscore.py', 'tests/test_rnscore_lxmf.py', 'tests/native/rns_*', 'tests/native/rnscore_*', 'tests/vectors/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # bench-a-core, bench-n1-core, bench-b-core i l0-core: obrazy płytek z rdzeniem zamiast portu (kompilacja, RAM, samotest).
        env: [bench-a, bench-n1, bench-b, l0, host, bench-a-core, bench-n1-core, bench-b-core, l0-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/stack
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini', 'firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Reticulum core with the ${{ matrix.env }} toolchain
        if: matrix.env != 'host'
        working-directory: firmware
        run: python tools/core_boards.py -e ${{ matrix.env }}
  hostile-port:
    # Ruch od węzła z kluczem sieci, skoki zegara, zaniki zasilania w zapisie FRAM; ASan i UBSan. Port
    # microReticulum (HostileStackTests), równolegle z rdzeniem w zadaniu hostile.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/.pio/stack
          key: stack-${{ hashFiles('firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: Station stack (port) under hostile traffic
        env:
          WICI_RNS_SANITIZE: '1'
        run: python -m unittest tests.test_rns_hostile.HostileStackTests -v
  hostile:
    # Te same scenariusze na rdzeniu Reticulum stacji (CoreHostileStackTests, w tym 60 dni wrogiego ruchu
    # i uszkodzenia FRAM), potem rdzeń wobec wektorów z Pythona, także jako program 32-bitowy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/.pio/stack
          key: stack-${{ hashFiles('firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: Station Reticulum core under hostile traffic
        env:
          WICI_RNS_SANITIZE: '1'
        run: python -m unittest tests.test_rns_hostile.CoreHostileStackTests -v
      - name: 32-bit compiler and sanitizer libraries (core as on the boards)
        run: sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get -o Acquire::Retries=3 install -y -q g++-multilib
      - name: Station Reticulum core against vectors from Python
        env:
          WICI_RNS_SANITIZE: '1'
        run: python -m unittest tests.test_rnscore -v
      - name: Station Reticulum core, LXMF SA1 messages against vectors from Python
        env:
          WICI_RNS_SANITIZE: '1'
        run: python -m unittest tests.test_rnscore_lxmf -v
  fuzz:
    # Rdzeń pod libFuzzerem przez 60 s (tools/core_fuzz.py; godzina w fuzz.yml), równolegle z resztą.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: firmware/.pio/stack
          key: stack-${{ hashFiles('firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: Station Reticulum core under libFuzzer (60 s)
        run: python firmware/tools/core_fuzz.py --seconds 60 --out "$RUNNER_TEMP/fuzz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rnscore-fuzz-crashes
          path: ${{ runner.temp }}/fuzz/crashes
          if-no-files-found: ignore
  interop:
    # Stos stacji wobec Reticulum w Pythonie (D19): tools/rns_interop.py i tools/rns_osp_node.py na porcie,
    # rns_interop.py w krokach, które rdzeń już ma (host-core, tests/test_rns_stack.py: CORE_STEPS), i
    # rns_osp_node.py --lxmf na rdzeniu (węzeł stanowiska z USB, zalew z USB). Próby
    # różnicowe idą osobnym zadaniem (differential), równolegle.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/stack
          key: pio-host-${{ hashFiles('firmware/platformio.ini', 'firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: PlatformIO Core, Reticulum and LXMF (Python) at the pinned commits
        run: |
          python -m pip install platformio==6.2.0
          python -m venv "$RUNNER_TEMP/rns"
          "$RUNNER_TEMP/rns/bin/pip" install "rns @ git+https://github.com/markqvist/Reticulum@e40191b3d193b46b7f2d8a44424a594cd758839b" \
            "lxmf @ git+https://github.com/markqvist/LXMF@c3ff2d6dc2f256daab896dadc044dd5a913ecbb7" pyserial==3.5
      - name: Station stack (port and core) against Reticulum in Python
        run: |
          WICI_PIO="$(command -v pio)" WICI_RNS_PYTHON="$RUNNER_TEMP/rns/bin/python" python -m unittest tests.test_rns_stack -v
      - name: Stack choice (port or core) keeps the station identity
        run: |
          WICI_PIO="$(command -v pio)" python -m unittest tests.test_rns_stack_choice -v
      - name: Core test vectors match Reticulum in Python
        run: |
          WICI_RNS_PYTHON="$RUNNER_TEMP/rns/bin/python" python -m unittest tests.test_rns_vectors -v
      - name: Core LXMF vectors match LXMF in Python
        run: |
          WICI_RNS_PYTHON="$RUNNER_TEMP/rns/bin/python" python -m unittest tests.test_rnscore_lxmf.VectorFileTests -v
  differential:
    # Próby różnicowe transportu rdzenia wobec Reticulum w Pythonie na tym samym ruchu (tools/rns_differential.py).
    # Osobno od interop, żeby oba zadania po około 5 min szły równolegle.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/stack
          key: pio-host-${{ hashFiles('firmware/platformio.ini', 'firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: Reticulum and LXMF (Python) at the pinned commits
        run: |
          python -m venv "$RUNNER_TEMP/rns"
          "$RUNNER_TEMP/rns/bin/pip" install "rns @ git+https://github.com/markqvist/Reticulum@e40191b3d193b46b7f2d8a44424a594cd758839b" \
            "lxmf @ git+https://github.com/markqvist/LXMF@c3ff2d6dc2f256daab896dadc044dd5a913ecbb7" pyserial==3.5
      - name: Core transport against Reticulum in Python on the same traffic (differential)
        env:
          WICI_RNS_SANITIZE: '1'
        run: |
          WICI_RNS_PYTHON="$RUNNER_TEMP/rns/bin/python" python -m unittest tests.test_rns_differential -v
