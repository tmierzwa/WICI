# SPDX-License-Identifier: MIT
# Kompilacja obrazów stacji (firmware/README.md): bench-a, bench-n1 (nRF52840) i bench-b (ESP32-S3).
# Wersje platform i rdzeni są przypięte w firmware/platformio.ini, stos Reticulum w tools/stack_deps.py.
name: Firmware
on:
  push:
    branches: [main]
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        env: [bench-a, bench-n1, bench-b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            firmware/.pio/stack
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini', 'firmware/tools/stack_deps.py', 'firmware/patches/**') }}
      - name: PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
