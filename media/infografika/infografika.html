<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>WICI – infografika</title>
<style>
@font-face{font-family:"Nunito Sans";src:url("../logo/fonts/NunitoSans%5BYTLC,opsz,wdth,wght%5D.ttf") format("truetype");font-weight:200 1000}
:root{--bg:#0f1216;--card:#171c23;--line:#2b333e;--ink:#ffffff;--muted:#aab3bf;--sig:#f4d345;--red:#ff6b5b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{width:1080px;height:1350px;overflow:hidden;font-family:"Nunito Sans",sans-serif;color:var(--ink);font-variation-settings:"opsz" 12}
.page{position:relative;width:1080px;height:1350px;padding:56px 72px 48px;display:flex;flex-direction:column}
/* faint background chain of dots */
.bg{position:absolute;inset:0;z-index:0;opacity:.07}
.page>*:not(.bg){position:relative;z-index:1}

.top{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between}
.top svg.logo{height:54px;width:auto}
.tag{font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;line-height:1.35}

h1{margin-top:30px;font-size:74px;line-height:.98;font-weight:950;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--sig)}
.lead{margin-top:20px;font-size:27px;line-height:1.32;font-weight:600;color:#dfe4ea;max-width:900px}
.lead b{color:var(--ink);font-weight:850}

.chain{margin-top:22px}
.chain svg{display:block;width:936px;height:auto}
.chain text{font-family:"Nunito Sans",sans-serif}

.steps{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 20px}
.num{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--sig);color:var(--bg);font-size:25px;font-weight:950}
.step h3{display:inline-block;vertical-align:middle;margin-left:12px;font-size:27px;font-weight:950;letter-spacing:.04em;text-transform:uppercase}
.step p{margin-top:12px;font-size:19px;line-height:1.36;color:#d3d9e0;font-weight:600}
.step p b{color:var(--ink);font-weight:850}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:#232a33;color:#e7ebf0}
.status{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.status span{font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-radius:8px;background:#232a33;color:#e7ebf0;display:flex;align-items:center;gap:8px}
.status span i{width:9px;height:9px;border-radius:50%;background:var(--sig);flex:none}

.facts{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.fact{padding:16px 10px 14px;text-align:center}
.fact+.fact{border-left:2px solid var(--line)}
.fact strong{display:block;font-size:32px;font-weight:950;color:var(--sig);line-height:1}
.fact span{display:block;margin-top:8px;font-size:16.5px;line-height:1.28;font-weight:700;color:var(--muted)}

.bottom{margin-top:22px;display:grid;grid-template-columns:1fr 1.12fr;gap:22px;align-items:stretch}
.warn{border:2.5px solid var(--red);border-radius:20px;padding:16px 20px;display:flex;gap:16px;align-items:center}
.warn .n{flex:none;font-size:46px;font-weight:950;color:var(--red);line-height:1}
.warn p{font-size:17.5px;line-height:1.32;font-weight:700;color:#e9edf1}
.warn p b{color:var(--ink);font-weight:900}
.cta{background:var(--sig);color:var(--bg);border-radius:20px;padding:16px 22px}
.cta .k{font-size:17px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.cta{display:flex;flex-direction:column;justify-content:center}
.cta .h{margin-top:6px;font-size:24px;line-height:1.2;font-weight:950}
.cta .u{margin-top:6px;font-size:22px;font-weight:950;letter-spacing:.01em}

.foot{margin-top:14px;display:flex;justify-content:space-between;font-size:16.5px;font-weight:700;color:#7f8996}
.foot b{color:var(--ink);font-weight:900;font-size:19px}
.foot{align-items:baseline}
.mini{display:block;width:100%;height:auto;margin-top:20px}
.note{font-size:17px!important;color:var(--muted)!important;margin-top:10px!important}

/* Stories 1080x1920: key content kept out of the top ~250 px and bottom ~300 px covered by app UI */
body.story{height:1920px}
.story .page{height:1920px;padding:250px 72px 300px}
.story h1{margin-top:44px;font-size:82px}
.story .lead{margin-top:24px;font-size:28px}
.story .chain{margin-top:28px}
.story .steps{margin-top:16px}
.story .facts{margin-top:30px}
.story .bottom{margin-top:30px}
.story .foot{margin-top:20px}
.deco{display:none}
.story .deco{display:block;position:absolute;left:0;right:0;bottom:120px;width:1080px;height:auto;opacity:.18;z-index:0}
</style>
</head>
<body>
<div class="page">
  <svg class="deco" viewBox="0 0 1080 80" aria-hidden="true"><path fill="none" stroke="#f4d345" stroke-width="6" stroke-linejoin="round" d="M0 40H470L494 4L528 76L548 22L560 40H1080"/></svg>

  <div class="top">
    <svg class="logo" viewBox="-40 -1010 2407 1050" role="img" aria-label="WICI" id="logo"></svg>
    <div class="tag" data-t="tag"></div>
  </div>

  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="chain">
    <svg viewBox="-60 40 1056 248" role="img" id="chain">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#aab3bf"/></marker>
      </defs>
      <!-- signal hops: line + pulse, logo motif -->
      <g fill="none" stroke="#f4d345" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M128 112H196L211 90L232 122L245 103L253 112H321"/>
        <path d="M375 112H433L448 90L469 122L482 103L490 112H558"/>
        <path d="M612 112H676L691 90L712 122L725 103L733 112H808"/>
      </g>
      <g font-size="17" font-weight="850" fill="#aab3bf" text-anchor="middle" letter-spacing="1">
        <text x="224" y="62" data-t="hop"></text><text x="466" y="62" data-t="hop"></text><text x="706" y="62" data-t="hop"></text>
      </g>
      <!-- nodes -->
      <g fill="#fff">
        <circle cx="72" cy="112" r="60"/>
        <circle cx="348" cy="112" r="34"/>
        <circle cx="585" cy="112" r="34"/>
        <circle cx="864" cy="112" r="60"/>
      </g>
      <!-- shelter icon -->
      <g fill="none" stroke="#0f1216" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M40 116L72 86L104 116"/><path d="M48 108V142H96V108"/>
        <circle cx="62" cy="120" r="5" fill="#0f1216" stroke="none"/><circle cx="82" cy="120" r="5" fill="#0f1216" stroke="none"/>
        <path d="M54 142V136a8 8 0 0 1 16 0V142M74 142V136a8 8 0 0 1 16 0V142" stroke-width="5"/>
      </g>
      <!-- relay station icons -->
      <g fill="none" stroke="#0f1216" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <rect x="333" y="110" width="30" height="20" rx="3"/><path d="M356 110V88"/><circle cx="356" cy="86" r="2.5" fill="#0f1216"/>
        <rect x="570" y="110" width="30" height="20" rx="3"/><path d="M593 110V88"/><circle cx="593" cy="86" r="2.5" fill="#0f1216"/>
      </g>
      <!-- town hall / duty desk icon -->
      <g fill="none" stroke="#0f1216" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M830 100L864 80L898 100Z"/><path d="M836 104H892"/>
        <path d="M842 108V134M857 108V134M871 108V134M886 108V134"/><path d="M830 140H898"/>
      </g>
      <!-- labels -->
      <g text-anchor="middle" fill="#fff">
        <text x="72" y="208" font-size="25" font-weight="950" data-t="n1"></text>
        <text x="72" y="236" font-size="18" font-weight="700" fill="#aab3bf" data-t="n1s"></text>
        <text x="466" y="186" font-size="21" font-weight="900" data-t="n2"></text>
        <text x="466" y="212" font-size="18" font-weight="700" fill="#aab3bf" data-t="n2s"></text>
        <text x="864" y="208" font-size="25" font-weight="950" data-t="n4"></text>
        <text x="864" y="236" font-size="18" font-weight="700" fill="#aab3bf" data-t="n4s"></text>
      </g>
      <!-- return path -->
      <path d="M800 270H136" stroke="#aab3bf" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" fill="none" marker-end="url(#ah)"/>
            <text x="468" y="276" text-anchor="middle" font-size="18" font-weight="850" fill="#aab3bf" letter-spacing="1" stroke="#0f1216" stroke-width="22" paint-order="stroke" stroke-linejoin="round" data-t="back"></text>
    </svg>
  </div>

  <div class="steps">
    <div class="step"><span class="num">1</span><h3 data-t="s1h"></h3><p data-t="s1"></p><div class="chips" id="chips"></div></div>
    <div class="step"><span class="num">2</span><h3 data-t="s2h"></h3><p data-t="s2"></p><svg class="mini" viewBox="0 0 300 44" aria-hidden="true"><g fill="none" stroke="#f4d345" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M22 26H54L63 12L76 34L84 22L89 26H124"/><path d="M152 26H184L193 12L206 34L214 22L219 26H254"/></g><g fill="#fff"><circle cx="22" cy="26" r="14"/><circle cx="138" cy="26" r="14"/><circle cx="262" cy="26" r="14"/></g></svg><p class="note" data-t="s2x"></p></div>
    <div class="step"><span class="num">3</span><h3 data-t="s3h"></h3><p data-t="s3"></p><div class="status" id="status"></div></div>
  </div>

  <div class="facts" id="facts"></div>

  <div class="bottom">
    <div class="warn"><div class="n">112</div><p data-t="warn"></p></div>
    <div class="cta"><div class="k" data-t="ctak"></div><div class="h" data-t="ctah"></div></div>
  </div>
  <div class="foot"><span data-t="foot1"></span><span data-t="foot2"></span></div>
</div>

<script>
const T={
pl:{
 tag:"Otwarty projekt<br>łączności kryzysowej",
 h1:"Gdy milkną telefony,<br><em>WICI</em> niosą wieść dalej.",
 lead:"Nie ma prądu, zasięgu ani internetu. W schronieniu brakuje wody, ktoś potrzebuje lekarza. <b>WICI to prosta stacja radiowa na baterie, która przekaże takie zgłoszenie do gminy.</b>",
 hop:"~1 KM",
 n1:"Schronienie", n1s:"szkoła, świetlica, garaż",
 n2:"Stacje sąsiadów", n2s:"każda włączona podaje dalej",
 n4:"Dyżurny gminy", n4s:"przekazuje służbom",
 back:"POTWIERDZENIE I DECYZJA WRACAJĄ",
 s1h:"Wpisz", s1:"Opiekun schronienia wskazuje <b>potrzebę, liczbę osób i pilność</b>. Kilka przycisków, bez klawiatury.",
 chips:["Pomoc medyczna","Woda","Leki","Ewakuacja","Ogrzewanie","Żywność"],
 s2h:"Wyślij", s2:"Stacja nadaje <b>krótką wiadomość radiem</b>. Jak dawne wici: od sąsiada do sąsiada.",
 s2x:"Brak drogi? Stacja zapamięta zgłoszenie i&nbsp;ponowi próbę.",
 s3h:"Odbierz", s3:"Dyżurny przyjmuje zgłoszenie i <b>odsyła decyzję</b>. Ekran w schronieniu pokazuje, co się dzieje:",
 status:["Odbiorca zapisał","Odbiorca przeczytał","Pomoc skierowana"],
 facts:[["2 doby","pracy na bateriach AA<br>(cel do sprawdzenia)"],["0","internetu i sieci<br>komórkowej"],["~1 km","między stacjami<br>(cel do sprawdzenia)"],["100%","otwarte: kod,<br>schematy, dokumenty"]],
 warn:"<b>Działa telefon? Dzwoń 112.</b><br>Stacje WICI uzupełniają system ochrony ludności, nie zastępują numeru alarmowego ani służb.",
 ctak:"Rozsyłamy WICI",
 ctah:"Szukamy krótkofalowców, elektroników, programistów i ludzi ze służb i gmin.",
 foot1:"<b>tmierzwa.github.io/WICI</b> – prototyp w przygotowaniu",
 foot2:"Projekt niekomercyjny · CC BY 4.0"
},
en:{
 tag:"Open-source<br>crisis communication",
 h1:"When phones go silent,<br><em>WICI</em> carries the word.",
 lead:"No power, no mobile signal, no internet. A shelter runs out of water, someone needs a doctor. <b>WICI stations are simple battery-powered radios that get that request to the local authority.</b>",
 hop:"~1 KM",
 n1:"Shelter", n1s:"school, hall, garage",
 n2:"Neighbouring stations", n2s:"each one passes it on",
 n4:"Duty officer", n4s:"passes it to services",
 back:"CONFIRMATION AND DECISION COME BACK",
 s1h:"Enter", s1:"The shelter warden picks <b>the need, number of people and urgency</b>. A few buttons, no keyboard.",
 chips:["Medical help","Water","Medicines","Evacuation","Heating","Food"],
 s2h:"Send", s2:"The station sends <b>a short radio message</b>, relayed neighbour to neighbour.",
 s2x:"No route yet? The station keeps the request and tries again.",
 s3h:"Receive", s3:"The duty officer takes the request and <b>sends back the decision</b>. The shelter's screen shows progress:",
 status:["Recipient saved it","Recipient read it","Help dispatched"],
 facts:[["2 days","on AA batteries<br>(target, to be tested)"],["0","internet or mobile<br>network needed"],["~1 km","between stations<br>(target, to be tested)"],["100%","open: code,<br>hardware, docs"]],
 warn:"<b>Phone working? Call 112.</b><br>WICI stations support local civil protection. They do not replace the emergency number or services.",
 ctak:"Spread the word",
 ctah:"Looking for radio amateurs, engineers, developers and people in civil protection.",
 foot1:"<b>tmierzwa.github.io/WICI</b> – prototype in preparation",
 foot2:"Non-commercial project · CC BY 4.0"
}};
const lang=(new URLSearchParams(location.search).get("lang"))||"pl";
const t=T[lang]; document.documentElement.lang=lang;
if(new URLSearchParams(location.search).get("format")==="story") document.body.classList.add("story");
document.querySelectorAll("[data-t]").forEach(e=>{e.innerHTML=t[e.dataset.t]});
document.getElementById("chips").innerHTML=t.chips.map(c=>`<span class="chip">${c}</span>`).join("");
document.getElementById("status").innerHTML=t.status.map(c=>`<span><i></i>${c}</span>`).join("");
document.getElementById("facts").innerHTML=t.facts.map(([a,b])=>`<div class="fact"><strong>${a}</strong><span>${b}</span></div>`).join("");
</script>
<script>
// logo paths are injected by the render script from media/logo/WICI-na-ciemnym.svg
</script>
</body>
</html>
