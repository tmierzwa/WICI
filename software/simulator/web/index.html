<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symulator stacji WICI</title>
<meta name="description" content="Stacja WICI w przeglądarce: ten sam obraz oprogramowania co na płytce bench-b, na wirtualnej płytce ESP32-S3 z S2-LP, FRAM i panelem Sharp; węzeł, stanowisko odbiorcze i ćwiczenia gospodarza.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img class="logo on-light" src="wici-logo.svg" alt="WICI" width="76" height="33">
    <img class="logo on-dark" src="wici-logo-ciemne.svg" alt="WICI" width="76" height="33">
    <span data-t="title">symulator stacji</span>
  </div>
  <div class="clock" aria-live="off">
    <span class="clock-label" data-t="simTime">czas symulacji</span>
    <output id="clock" class="clock-value">00:00:00</output>
  </div>
  <div class="speed" role="group" aria-label="Tempo">
    <button type="button" id="speed-0" data-speed="0" data-t="pause">pauza</button>
    <button type="button" id="speed-1" data-speed="1" class="on">1×</button>
    <button type="button" id="speed-10" data-speed="10">10×</button>
    <button type="button" id="speed-60" data-speed="60">60×</button>
  </div>
  <div class="skip" role="group" aria-label="Przeskok">
    <button type="button" id="skip-1" data-skip="60000">+1 min</button>
    <button type="button" id="skip-15" data-skip="900000">+15 min</button>
    <button type="button" id="skip-60" data-skip="3600000">+1 h</button>
  </div>
  <div class="tools">
    <button type="button" id="sound" aria-pressed="false" data-t="soundOff">dźwięk wył.</button>
    <button type="button" id="lang" aria-label="Język interfejsu">EN</button>
    <a id="feedback" class="feedback" href="https://github.com/tmierzwa/WICI/issues/new?template=uwaga-symulator.yml" target="_blank" rel="noopener" data-t="feedback">Zgłoś uwagę</a>
  </div>
</header>

<main class="work">
  <section class="bench" aria-labelledby="bench-title">
    <div class="bench-head">
      <h1 id="bench-title"><span id="station-name">WICI</span><span class="state" id="station-state"></span></h1>
      <label class="check"><input type="checkbox" id="real-size"> <span data-t="realSize">skala 1:1</span></label>
    </div>
    <p class="busy" id="busy" role="status" hidden></p>
    <div class="device-wrap" id="device-wrap">
      <div class="device" id="device"></div>
    </div>
    <div class="fine">
      <p data-t="keys"></p>
      <p id="build-info"></p>
    </div>
    <div class="calib" id="calib" hidden>
      <div class="card-outline" id="card-outline"><span data-t="card">karta płatnicza 85,6 × 54 mm</span></div>
      <label for="ppmm"><span data-t="calibrate">Dopasuj ramkę do prawdziwej karty</span> <output id="ppmm-out"></output></label>
      <input type="range" id="ppmm" min="2" max="8" step="0.01">
    </div>
  </section>

  <section class="side">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-train" data-tab="train" aria-controls="panel-train" aria-selected="true" data-t="tabTrain">Ćwiczenia</button>
      <button type="button" role="tab" id="tab-rx" data-tab="rx" aria-controls="panel-rx" aria-selected="false" data-t="tabRx">Dyżurny</button>
      <button type="button" role="tab" id="tab-env" data-tab="env" aria-controls="panel-env" aria-selected="false" data-t="tabEnv">Warunki</button>
      <button type="button" role="tab" id="tab-console" data-tab="console" aria-controls="panel-console" aria-selected="false" data-t="tabConsole">Konsola</button>
      <button type="button" role="tab" id="tab-log" data-tab="log" aria-controls="panel-log" aria-selected="false" data-t="tabLog">Dziennik</button>
    </nav>
    <div class="panel" id="panel-train" role="tabpanel" aria-labelledby="tab-train"></div>
    <div class="panel" id="panel-rx" role="tabpanel" aria-labelledby="tab-rx" hidden></div>
    <div class="panel" id="panel-env" role="tabpanel" aria-labelledby="tab-env" hidden></div>
    <div class="panel" id="panel-console" role="tabpanel" aria-labelledby="tab-console" hidden></div>
    <div class="panel" id="panel-log" role="tabpanel" aria-labelledby="tab-log" hidden></div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
