; SPDX-License-Identifier: MIT
; WICI: oprogramowanie stacji. Środowisko "bench-a" to stanowisko deweloperskie A
; (nRF52840-DK + moduł CC1120EM-868-915) na przewodach, "bench-n1" to samo na płytce nośnej N1,
; "bench-b" to stanowisko B (ESP32-S3-DevKitC-1 + X-NUCLEO-S2868A2) na N1; opis w README.md tego katalogu.
[platformio]
default_envs = bench-a

[env]
monitor_speed = 115200
monitor_filters = direct

; Stos Reticulum (microReticulum i biblioteki) z przypiętych commitów, z łatami WICI:
; tools/stack_deps.py pobiera je do .pio/stack przed kompilacją (README, "Stos Reticulum").
[stack]
extra_scripts = pre:tools/stack_deps.py
lib_extra_dirs = .pio/stack
build_unflags =
    -std=gnu++11
    -fno-exceptions
    -fno-rtti
    --specs=nano.specs
build_flags =
    --specs=nosys.specs
    ${stack.rns_flags}
    ${stack.pool_flags}
    ; pula TLSF stosu: szczyt przy pełnych tablicach 100 620 B (tools/rns_ram32.py, README "Pamięć RAM")
    ; i 6% zapasu; zostaje około 7 KB sterty poza pulą i stosami zadań
    -DRNS_HEAP_POOL_BUFFER_SIZE=106496
; konfiguracja stosu wspólna dla obrazów i programu węzła na komputerze (env:host)
rns_flags =
    ; src/ także dla bibliotek: łata 0002 dołącza pkthash.h
    -Isrc
    -DMSGPACK_USE_BOOST=OFF
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_NOTICE
    -DDEBUGLOG_DEFAULT_LOG_LEVEL_WARN
    ; tablice w FRAM (framfs), pojemności ze specyfikacji, lista skrótów 4096 x 8 B (łata 0002)
    -DRNS_USE_FS
    -DRNS_PERSIST_HASHLIST=0
    -DRNS_SHORT_PACKET_HASHES
    -DRNS_PATH_TABLE_MAX=256
    -DRNS_PATH_TABLE_SEGMENT_SIZE=16384
    -DRNS_PATH_TABLE_SEGMENT_COUNT=4
    -DRNS_KNOWN_DESTINATIONS_MAX=256
    -DRNS_KNOWN_DESTINATIONS_SEGMENT_SIZE=12288
    -DRNS_KNOWN_DESTINATIONS_SEGMENT_COUNT=4
    -DRNS_HASHLIST_MAX=4096
    ; ogłoszenia czekające na retransmisję (z pakietem w RAM): interfejs P1 przepuszcza
    ; najwyżej jedno przekazywane ogłoszenie na około 5 min, więc 100 wpisów portu to tylko
    ; szczyt pamięci przy napływie ogłoszeń (README, "Pamięć RAM")
    -DRNS_ANNOUNCE_TABLE_MAX=16
    ; funkcja portu bez odpowiednika w Reticulum (sondy sąsiadów): dodatkowy ruch na P1
    -DRNS_NEIGHBOR_PROBING=0
; cały przydział pamięci stosu z puli TLSF o stałym rozmiarze (nRF52840 i program na komputerze);
; na ESP32 port bierze stertę ESP-IDF, a jego tlsf.c nie wchodzi do kompilacji (TLSF jest w ROM)
pool_flags =
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
    -DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR

; Flagi wspólne dla obrazów nRF52840 (bench-a, bench-n1).
[nrf]
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_CDC=2
    ; nieużywane klasy TinyUSB (MSC, HID, MIDI, vendor, video): -3,4 KB RAM, -13,7 KB flash
    -DCFG_TUD_MSC=0
    -DCFG_TUD_HID=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VENDOR=0
    -DCFG_TUD_VIDEO=0
    -Wall
    ${stack.build_flags}

[env:bench-a]
platform = nordicnrf52@11.0.0
board = nrf52840_dk_adafruit
framework = arduino
platform_packages =
    platformio/framework-arduinoadafruitnrf52@1.10700.0
build_flags =
    ${nrf.build_flags}
    -DWICI_BENCH_A
    -DWICI_FW_VERSION=\"bench-a-0.1\"
build_unflags = ${stack.build_unflags}
extra_scripts = ${stack.extra_scripts}
lib_extra_dirs = ${stack.lib_extra_dirs}
; sterowniki S2-LP tylko w obrazie bench-b
build_src_filter = +<*> -<host/> -<s2lp.cpp> -<s2lp_link.cpp> -<radio_console_s2lp.cpp> -<platform_esp32.cpp> -<sharp_extcomin_esp32.cpp>
upload_protocol = jlink

; Stanowisko A na płytce nośnej N1 (hardware/dev-bench/plytka-nosna.md): inne piny SPI, radia
; i ekranu, panel płytki; plik opisu płytki src/board_bench_n1.h.
[env:bench-n1]
extends = env:bench-a
build_flags =
    ${nrf.build_flags}
    -DWICI_BENCH_N1
    -DWICI_FW_VERSION=\"bench-n1-0.1\"

; Stanowisko B na płytce nośnej N1: ESP32-S3-DevKitC-1 (moduł N8, N8R2 albo N8R8, flash quad SPI; PSRAM
; nieużywana) z X-NUCLEO-S2868A2 (ST S2-LP); plik opisu płytki src/board_bench_b.h. Ten sam
; program stacji co A (main.cpp) z warstwą ESP32-S3 (platform_esp32.cpp) i S2-LP
; (radio_console_s2lp.cpp, s2lp_link.cpp); sterowniki CC1120 nie wchodzą do obrazu.
; Arduino-ESP32 3.3.12 (ESP-IDF 5.5) z platformy pioarduino: dopiero ta wersja daje dwa interfejsy
; CDC przez USB-OTG z TinyUSB (radio.md, "USB do laptopa"); 2.0.17 z espressif32@6.9.0 ma jeden.
; USB: złącze "USB" płytki (USB-OTG, GPIO19/20), nie "UART". ARDUINO_USB_MODE=0 wyłącza
; USB-Serial/JTAG (plik płytki ustawia 1). Wgrywanie przez ten sam port: dotknięcie 1200 b/s
; restartuje do bootloadera ROM; gdy program nie odpowiada, BOOT przytrzymany przy RESET.
[env:bench-b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<cc1120.cpp> -<cc1120_link.cpp> -<radio_console_cc1120.cpp> -<host/>
; stos bez --specs=nosys.specs (newlib ESP-IDF ma własne wywołania systemowe) i bez puli TLSF:
; pamięć stosu ze sterty ESP-IDF, polecenie RNS podaje wtedy pulę 0
build_unflags =
    -DARDUINO_USB_MODE=1
    ${stack.build_unflags}
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_MANUFACTURER=\"WICI\"
    -DUSB_PRODUCT=\"WICI\ bench-b\"
    -DWICI_BENCH_B
    -DWICI_FW_VERSION=\"bench-b-0.1\"
    -Wall
    ${stack.rns_flags}
extra_scripts = ${stack.extra_scripts}
lib_extra_dirs = ${stack.lib_extra_dirs}
upload_protocol = esptool
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; Węzeł stacji na komputerze: ten sam stos, interfejs P1 i FRAM (plik) z emulatorem łącza P1
; i mostem UDP do Reticulum w Pythonie; próba zgodności tools/rns_interop.py (README, "Stos Reticulum").
[env:host]
platform = native@1.2.1
build_src_filter = -<*> +<framfs.cpp> +<p1frame.cpp> +<p1iface.cpp> +<rns_node.cpp> +<host/>
build_unflags = -std=gnu++11
build_flags =
    -DNATIVE
    ${stack.rns_flags}
    ${stack.pool_flags}
    ; 64-bitowe wskaźniki i kontenery: pula większa niż w obrazie (pomiar szczytu w README)
    -DRNS_HEAP_POOL_BUFFER_SIZE=1048576
    -Wall
extra_scripts = ${stack.extra_scripts}
lib_extra_dirs = ${stack.lib_extra_dirs}
lib_compat_mode = off
