; SPDX-License-Identifier: MIT
; WICI: oprogramowanie stacji. Środowisko "bench-a" to stanowisko deweloperskie A
; (nRF52840-DK + moduł CC1120EM-868-915) na przewodach, "bench-n1" to samo na płytce nośnej N1,
; "bench-b" to stanowisko B (ESP32-S3-DevKitC-1 + X-NUCLEO-S2868A2) na N1; opis w README.md tego katalogu.
[platformio]
default_envs = bench-a

[env]
monitor_speed = 115200
monitor_filters = direct

[env:bench-a]
platform = nordicnrf52@11.0.0
board = nrf52840_dk_adafruit
framework = arduino
platform_packages =
    platformio/framework-arduinoadafruitnrf52@1.10700.0
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_CDC=2
    ; nieużywane klasy TinyUSB (MSC, HID, MIDI, vendor, video): -3,4 KB RAM, -13,7 KB flash
    -DCFG_TUD_MSC=0
    -DCFG_TUD_HID=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VENDOR=0
    -DCFG_TUD_VIDEO=0
    -DWICI_BENCH_A
    -DWICI_FW_VERSION=\"bench-a-0.1\"
    -Wall
upload_protocol = jlink

; Stanowisko A na płytce nośnej N1 (hardware/dev-bench/plytka-nosna.md): inne piny SPI, radia
; i ekranu, panel płytki; plik opisu płytki src/board_bench_n1.h.
[env:bench-n1]
extends = env:bench-a
build_flags =
    -DUSE_TINYUSB
    -DCFG_TUD_CDC=2
    -DCFG_TUD_MSC=0
    -DCFG_TUD_HID=0
    -DCFG_TUD_MIDI=0
    -DCFG_TUD_VENDOR=0
    -DCFG_TUD_VIDEO=0
    -DWICI_BENCH_N1
    -DWICI_FW_VERSION=\"bench-n1-0.1\"
    -Wall

; Stanowisko B na płytce nośnej N1: ESP32-S3-DevKitC-1 (moduł N8R2, N8R8 albo N16R16V; PSRAM
; nieużywana) z X-NUCLEO-S2868A2 (ST S2-LP); plik opisu płytki src/board_bench_b.h, program
; src/main_bench_b.cpp. Pliki zależne od nRF52840 (main.cpp, cc1120.cpp, measure.cpp) nie wchodzą
; do obrazu. USB: wbudowany USB-Serial/JTAG na złączu "USB" płytki (jeden port CDC).
[env:bench-b]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<main.cpp> -<cc1120.cpp> -<measure.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWICI_BENCH_B
    -DWICI_FW_VERSION=\"bench-b-0.1\"
    -Wall
upload_protocol = esptool
